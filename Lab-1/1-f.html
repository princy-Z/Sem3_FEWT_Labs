<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>lab-1-f</title>
	<style>
		div{
			width:100px;
			height: 100px;
			background-color: red;
			position: absolute;
			animation-name: Rotatebox;
			animation-duration: 3s;
			animation-iteration-count: infinite;
			animation-timing-function: ease-in-out;
		}

		@keyframes Rotatebox{
			0%{
				margin-top:0px;
				margin-left:0px;
			}
			25%{
				margin-top:0px;
				margin-left:200px;
			}
			50%{
				margin-top:200px;
				margin-left:200px;
			}
			75%{
				margin-top:200px;
				margin-left:0px;
			}
			100%{
				margin-top:0px;
				margin-left:0px;
			}
		}
	</style>
</head>
<body>
	<div></div>
</body>
</html>
