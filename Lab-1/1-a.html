<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>lab-1-a</title>
	<style>
		div{
			width:100px;
			height: 100px;
			background-color: red;

			animation-name:Colorchange;
			animation-duration: 5s;
		}

		@keyframes Colorchange{
			from{
				background-color: red;
			}
			to{
				background-color: yellow;
			}
		}
	</style>
</head>
<body>
	<div></div>
</body>
</html>
