<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>Click Anywhere!</div>
    <p id="myP"></p>
    <script>
        obj = addEventListener('click',()=>{
            document.getElementById("myP").innerHTML = "left clicked!";
        });

        obj = addEventListener('contextmenu',(event)=>{
            event.preventDefault();
            document.getElementById("myP").innerHTML = "Right clicked!";
        })
    </script>
</body>
</html>
