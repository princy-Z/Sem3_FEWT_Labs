<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-5-5</title>
</head>
<body>
    <script>
        string = prompt("Enter a string:");

        arr = string.split(" ");

        word = prompt("Enter a word from your given string:");

        for(i=0 ; i<arr.length ; i++)
        {
            if(word == arr[i])
            {
                index = i;
            }
        }

        document.write("Your given word on index "+index);
    </script>
</body>
</html>
