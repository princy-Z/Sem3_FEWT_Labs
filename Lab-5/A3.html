<!--bubble sorting-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-5-3</title>
</head>
<body>
    <script>
        n = parseInt(prompt("Enter no. of elements:"));
        arr=[n];

        for(i=0 ; i<n ; i++)
        {
            arr[i] = parseInt(prompt("Enter an elements:"));
        }

        document.write("Before sorting : "+arr+"<br/>");

        for(i=0 ; i< n-1 ; i++)
        {
            for (j=0 ; j< n-i-1 ; j++) 
            {
                if(arr[j] > arr[j+1])
                {
                    temp = arr[j];
                    arr[j] = arr[j+1];
                    arr[j+1] = temp;
                }
            }
        }

        document.write("After sorting : "+arr);
    </script>
</body>
</html>
