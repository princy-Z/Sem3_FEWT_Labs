<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-5-1</title>
</head>
<body>
    <script>
        n = parseInt(prompt("Enter no. of elements:"));
        arr=[n];

        for(i=0 ; i<n ; i++)
        {
            arr[i] = parseInt(prompt("Enter an elements:"));
        }
        max = arr[0]
        for(i=0 ; i<n ; i++)
        {
            if(arr[i]>max)
            {
                max = arr[i];
            }
        }

        document.write("Array : "+arr+"<br/>");
        document.write("Maximum number:"+max);

    </script>
</body>
</html>
