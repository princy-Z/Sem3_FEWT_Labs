<!-- Replace a word with another in string -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra</title>
</head>
<body>
    <script>
        S = prompt("Enter a string:");
        searchword = prompt("Enter word to find:");
        replaceword = prompt("Enter a word to replace:");
        arr = S.split(" ");

        for(i=0 ; i<arr.length ; i++)
        {
            if(searchword == arr[i])
            {
                arr[i] = replaceword;
            }
        }
        document.write(arr);
    </script>
</body>
</html>
