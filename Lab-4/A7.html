<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-4-7</title>
</head>
<body>
    <script>
        S = prompt("Enter a string");

        firstIndex = S.indexOf('a');
        lastIndex = S.lastIndexOf('a');

        str = S.substring(firstIndex+1,lastIndex);
        document.write("String = "+str+"<br/>");
        document.write("firstIndex = " + firstIndex + "<br/>");
        document.write("lastIndex = " + lastIndex + "<br/>");
    </script>
</body>
</html>
