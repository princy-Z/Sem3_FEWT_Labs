<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-4-4</title>
</head>
<body>
    <script>
        n1 = parseInt(prompt("Enter num-1:"));
        n2 = parseInt(prompt("Enter num-2:"));

        gcd = 1;

        min = Math.min(n1,n2);

        for(i = 2 ; i<= min ; i++ )
        {
            if(n1%i == 0 && n2%i == 0)
            {
                gcd = i;
            }
        }
        document.write(gcd);
    </script>
</body>
</html>
