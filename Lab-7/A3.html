<!--3. WAP to create a scientiƒc graphical calculator using HTML and JavaScript.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-7-3</title>
    <style>
        div{
            margin-left: 30%;
            height:100vh;
            width:40vw;
            align-items: center;
            background-color: black;
            padding:20px;
            border-radius:10px;
            box-shadow: 0px 5px 5px 5px;
        }
        table{
            width:100%;
            height:80%; 
            background-color: rgb(85, 87, 104);
            border-radius:10px;
            margin-top: 6.5%;
        }
        td{
            height:17%;
            width:20%;
            margin-left:10px;
        }
        input{
            height:15%;
            width:98%;
            column-span: all;
            border: 1px solid black;
            background-color: rgb(223, 228, 245);
            font-weight: 400;
            font-size: 30px;
            border: 2px solid rgb(10, 10, 69);
            border-radius:10px;
        }
        button{
            background-color: rgb(222, 221, 240);
            border-radius:10px;
            margin-left:6px;
            height:70%;
            width:70%;
            font-weight: 400;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div>
    <table>

        <tr>
            <input type="text" id="mytext" />
        </tr>

        <tr>
            <td><button onclick="AC()">AC</button></td>
            <td><button onclick="backspace()">DEL</button></td>
            <td><button onclick="appendtext('(')">(</button></td>
            <td><button onclick="appendtext(')')">)</button></td>
            <td><button onclick="appendtext('/')">/</button></td>
        </tr>

        <tr>
            <td><button onclick="cal('sin')">sin</button></td>
            <td><button onclick="appendtext('7')">7</button></td>
            <td><button onclick="appendtext('8')">8</button></td>
            <td><button onclick="appendtext('9')">9</button></td>
            <td><button onclick="appendtext('*')">*</button></td>
        </tr>

        <tr>
            <td><button onclick="cal('cos')">cos</button></td>
            <td><button onclick="appendtext('4')">4</button></td>
            <td><button onclick="appendtext('5')">5</button></td>
            <td><button onclick="appendtext('6')">6</button></td>
            <td><button onclick="appendtext('-')">-</button></td>
        </tr>

        <tr>
            <td><button onclick="cal('tan')">tan</button></td>
            <td><button onclick="appendtext('1')">1</button></td>
            <td><button onclick="appendtext('2')">2</button></td>
            <td><button onclick="appendtext('3')">3</button></td>
            <td><button onclick="appendtext('+')">+</button></td>
        </tr>

        <tr>
            <td><button onclick="cal('log')">log</button></td>
            <td><button onclick="cal('sqrt')">sqrt</button></td>
            <td><button onclick="appendtext('0')">0</button></td>
            <td><button onclick="appendtext('.')">.</button></td>
            <td><button onclick="appendtext('x')">X</button></td>
        </tr>

        <tr>
            <td><button onclick="cal('pie')">pie</button></td>
            <td><button onclick="cal('e')">e</button></td>
            <td><button onclick="cal('pow')">^2</button></td>
            <td><button onclick="appendtext('cube')">^3</button></td>
            <td><button onclick="finalans()">Ans</button></td>
        </tr>

    </table>
    </div>
    <script>
        function AC() {
            document.getElementById("mytext").value = "";
        }

        function backspace()
        {
            exp = document.getElementById("mytext").value;
            document.getElementById("mytext").value = exp.slice(0,-1);
        }
        function appendtext(exp)
        {
            document.getElementById("mytext").value += exp;
        }
        function cal(exp)
        {
            exp = document.getElementById("mytext").value;
            if(exp == 'sin') exp+=Math.sin(exp);
            else if(exp == 'cos') exp+=Math.cos(exp);
            else if(exp == 'tan') exp+=Math.tan(exp);
            else if(exp == 'sqrt') exp+=Math.sqrt(exp);
            else if(exp == 'pow') exp += Math.pow(exp,2);
            else if(exp == 'cube') exp += Math.pow(exp,3);
            else if(exp == 'pi') exp+=Math.PI();
            else if(exp == 'e') exp+=Math.E();
        }
        function finalans()
        {
            exp = document.getElementById("mytext").value;
            document.getElementById("mytext").value = eval(exp);
        }
    </script>
</body>
</html>
