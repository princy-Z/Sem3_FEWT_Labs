<!--2. WAP to create a static login page using HTML and JavaScript.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-7-2</title>
    <style>
        div{
            height: 50%;
            width:15%; 
            background-color:rgb(224, 229, 236); 
            border-radius: 5%;  
            padding:5%; 
            align-items: center; 
            margin-top: 15%;
            margin-left: 40%;
        }
        input{
            border: 1px solid black; 
            border-radius: 5px;
            height:22px;
            width:100%;
            margin-top: 6px;
        }
        button{
            width:100%;
            height:30px; 
            background-color: rgb(128, 10, 154);
            border-radius: 5px; 
            color: white;
        }
    </style>
</head>
<body>
    <div>
    <label>Username :</label>
    <input type="text" id="username" placeholder="Enter username"/>
    <br/>
    <br/>
    <label>Password :</label>
    <input type="password" id="pass" placeholder="Enter password"/>
    <br/><br/>
    <button onclick="login()">Login</button>
    </div>
    <script>
        function login()
        {
            username = document.getElementById("username").value;
            password = document.getElementById("pass").value;

            corrusername = "admin";
            corrpassword = "1234";

            if(!(corrpassword == password && corrusername == username))
            {
                alert("Invalid username or password!");
            }
            else{
                alert("login successfully!");
            }
        }
    </script>
</body>
</html>
