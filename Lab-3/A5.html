<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-3-5</title>
</head>
<body>
    <script>
        a = parseInt(prompt("Enter a number:"));
        temp = a;
        sum=0;

        while(a!=0){
            rem = a % 10;
            sum = sum*10 + rem;
            a = parseInt(a/10);
        }
        if (temp == sum) {
            document.write(temp+" is palidrom...");
        }else{
            document.write(temp+" is not palidrom...");
        }

    </script>
</body>
</html>
