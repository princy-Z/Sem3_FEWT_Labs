<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-3-3</title>
</head>
<body>
    <script>
        n = parseInt(prompt("Enter a number to print fibbonacci series:"));
        a=0;
        b=1;
        for (i = 0; i<=n ; i++) {
            c=a+b;
            document.write(a+" ");
            a=b;
            b=c;
        }
    </script>
</body>
</html>
