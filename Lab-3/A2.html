<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-3-2</title>
</head>
<body>
    <script>
        a = parseInt(prompt("Enter a number to check prime or not:"));
        count=0;
        for(i=0 ; i <= a ; i++){
            if (a%i == 0) {
                count++;
            }
        }

        if(count == 2){
            document.write(a+" is a prime number...");
        }else{
            document.write(a+" is not a prime number...");
        }
    </script>
</body>
</html>
