<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-3-3</title>
</head>
<body>
    <script>
        a = parseInt(prompt("Enter a number to find fact:"));
        fact=1;
        for(i=1 ; i <= a ; i++){
           fact *= i; 
        }
        document.write("Factorial of "+a+" is "+fact);
    </script>
</body>
</html>
