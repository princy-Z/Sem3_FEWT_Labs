<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-6-3</title>
</head>
<body>
    <script>
        arr = [
            {
                Name : "Ram",
                Age : 17,
                SPI : 9.8,
                Branch : "computer"
            },
             {
                Name : "Ramesh",

                SPI : 9.8,
                Branch : "computer"
            },
             {
                Name : "Mahesh",
                Age : 17,
                SPI : 9.8,
                Branch : "computer"
            },
             {

                Age : 18,
                SPI : 9.8,

            },
             {
                Name : "Rutvi",

            }

            document.write(`

            `);

                    document.write(`
                    <tr>

                    <td>${arr[i].SPI}</td>
                    <td>${arr[i].Branch}</td>

                    `);
                }
        document.write("</table>");
    </script>
