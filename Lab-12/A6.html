<!-- write a jQuery program to append new row to existing table when clicked on button. -->

  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

  </head>
  <body>
    
    <button id="btn1">Append</button>
    <button id="btn2">Preppend</button>
    <table border="2">
        <thead>
            <th>RNO</th>
            <th>Name</th>
            <td>SPI</td>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Riya</td>
                <td>7.55</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Tulsi</td>
                <td>7.66</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Princy</td>
                <td>7.77</td>
            </tr>
        </tbody>
    </table>

    <script>
        $("#btn1").click(()=>{
            $("tbody").append("<tr> <td>4</td> <td>Ayushi</td> <td>7.88</td> </tr>");
        })

        $("#btn2").click(()=>{
            $("tbody").prepend("<tr> <td>5</td> <td>Nancy</td> <td>7.44</td> </tr>");
        })
    </script>
  </body>
  </html>
