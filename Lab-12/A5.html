<!-- write a jQuery program to append new list item with "Hello World" to existing unordered list 
when clicked on button.  -->

  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

  </head>
  <body>
    
    <button id="btn1">Append</button>
    <button id="btn2">Preppend</button>
    <ul>
        <li>a</li>
        <li>b</li>
        <li>c</li>
    </ul>

    <script>
        $("#btn1").click(()=>{
            $("ul").append("<li>Hello World</li>");
        })

        $("#btn2").click(()=>{
            $("ul").prepend("<li>Hello World</li>");
        })
    </script>
  </body>
  </html>
