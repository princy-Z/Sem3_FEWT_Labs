<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        function sum(a,b,callback)
        {
            sum = a+b;
            callback(sum);
        }
        function printsum(ans)
        {
            document.write("Answer : "+ans);
        }
        sum(5,5,printsum);
    </script>
</body>
</html>
