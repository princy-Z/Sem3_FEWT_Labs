<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Array sprade
        arr1 = [10,20,30,40,50];
        document.write("arr1 : "+arr1 + '<br/>');
        arr2 = [...arr1];
        document.write("arr2 : " +arr2 + '<br/>');

        arr3 = [...arr1,...arr2];
        document.write("arr3 : "+arr3 + '<br/>');

        //Object sprade
        obj1 = {
            name : 'Ayushi',
            age : '18',
            city : 'Porabandar'
        }
        console.log(obj1);

        obj2 = {...obj1};
        console.log(obj2);
        obj3 = {
            pin : '360004',
            State : 'Gujarat'
        }
        obj4 = {...obj1,...obj3};
        console.log(obj4);

    </script>
</body>
</html>
